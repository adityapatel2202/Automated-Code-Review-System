{% extends "layout/base.html" %}

{% block title %}
Analysis Result
{% endblock %}

{% block content %}

<div class="container mt-4">

    <!-- Page Title -->
    <div class="mb-4">
        <h2>🤖 Automated Code Review Dashboard</h2>
        <p class="text-muted">
            Analysis completed successfully.
        </p>
    </div>

    <!-- Quality Score -->
    <div class="card dashboard-card quality-card">

        <h4>Overall Quality Score</h4>

        <h1 class="display-3 text-success">
            {{ result.quality_score }} / 100
        </h1>

        <div class="progress mt-4">

            <div class="progress-bar bg-success"
                 style="width:{{ result.quality_score }}%;">

                {{ result.quality_score }}%

            </div>

        </div>

        <p class="mt-3 text-success fw-bold">
            GOOD QUALITY
        </p>

    </div>

</div>

{% endblock %}
